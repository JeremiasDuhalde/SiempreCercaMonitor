name: Build & Deploy Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
          cp app/build/outputs/apk/debug/app-debug.apk "siemprecerca-monitor-v${VERSION}.apk"
          echo "APK_NAME=siemprecerca-monitor-v${VERSION}.apk" >> "$GITHUB_ENV"
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: siemprecerca-monitor-apk
          path: siemprecerca-monitor-*.apk
          retention-days: 90

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: siemprecerca-monitor-*.apk

      - name: Deploy APK al servidor
        if: github.ref == 'refs/heads/main'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "::warning::Secrets SSH no configurados, saltando deploy"
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Subir APK con nombre fijo (auto-update y HTML apuntan a este nombre)
          scp -i ~/.ssh/deploy_key "$APK_NAME" "${SSH_USER}@${SSH_HOST}:/opt/siemprecerca/frontend/public/monitor/siemprecerca-monitor-v1.0.0.apk"

          # Copiar al container nginx
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" "\
            cd /opt/siemprecerca && \
            docker compose cp frontend/public/monitor/siemprecerca-monitor-v1.0.0.apk frontend:/usr/share/nginx/html/monitor/siemprecerca-monitor-v1.0.0.apk && \
            echo 'APK v${{ env.APK_VERSION }} desplegado en produccion'"

          rm -f ~/.ssh/deploy_key
