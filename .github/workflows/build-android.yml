name: Build & Deploy Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/siemprecerca-release.jks
            echo "Keystore decoded OK"
          else
            echo "::warning::KEYSTORE_BASE64 no configurado, building debug"
          fi

      - name: Configure signing and memory
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            sed -i "s/keystorePassword=.*/keystorePassword=$KEYSTORE_PASSWORD/" gradle.properties
          fi
          # Mas RAM para R8/ProGuard
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8/' gradle.properties

      - name: Build Release APK
        run: |
          if [ -f "app/siemprecerca-release.jks" ]; then
            ./gradlew assembleRelease
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          else
            ./gradlew assembleDebug
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
          cp "$APK_PATH" "siemprecerca-monitor-v${VERSION}.apk"
          echo "APK_NAME=siemprecerca-monitor-v${VERSION}.apk" >> "$GITHUB_ENV"
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: siemprecerca-monitor-apk
          path: siemprecerca-monitor-*.apk
          retention-days: 90

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: siemprecerca-monitor-*.apk

      - name: Deploy APK al servidor
        if: github.ref == 'refs/heads/main'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "::warning::Secrets SSH no configurados, saltando deploy"
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/deploy_key "$APK_NAME" "${SSH_USER}@${SSH_HOST}:/opt/siemprecerca/frontend/public/monitor/siemprecerca-monitor-v1.0.0.apk"

          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | grep -oP '[0-9]+')
          echo "{\"version\":\"${APK_VERSION}\",\"versionCode\":${VERSION_CODE},\"url\":\"/monitor/siemprecerca-monitor-v1.0.0.apk\"}" > /tmp/version.json
          scp -i ~/.ssh/deploy_key /tmp/version.json "${SSH_USER}@${SSH_HOST}:/opt/siemprecerca/frontend/public/monitor/version.json"

          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" "\
            cd /opt/siemprecerca && \
            docker compose cp frontend/public/monitor/siemprecerca-monitor-v1.0.0.apk frontend:/usr/share/nginx/html/monitor/siemprecerca-monitor-v1.0.0.apk && \
            docker compose cp frontend/public/monitor/version.json frontend:/usr/share/nginx/html/monitor/version.json && \
            echo 'APK v${APK_VERSION} + version.json desplegado en produccion'"

          rm -f ~/.ssh/deploy_key
