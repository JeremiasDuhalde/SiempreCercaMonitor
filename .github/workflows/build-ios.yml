name: Build iOS App

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Xcode project
        run: |
          cd ios
          # Crear proyecto Xcode usando swift package
          mkdir -p SiempreCercaMonitor.xcodeproj

          # Generar project.pbxproj basico
          cat > project.yml << 'EOF'
          name: SiempreCercaMonitor
          options:
            bundleIdPrefix: com.siemprecerca
            deploymentTarget:
              iOS: "15.0"
          targets:
            SiempreCercaMonitor:
              type: application
              platform: iOS
              sources:
                - path: .
                  excludes:
                    - "*.yml"
                    - "*.md"
                    - "*.xcodeproj"
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.siemprecerca.monitor
                INFOPLIST_FILE: Info.plist
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_ALLOWED: "NO"
              capabilities:
                Background Modes:
                  modes:
                    - bluetooth-central
          EOF

          # Instalar xcodegen
          brew install xcodegen

          # Generar proyecto
          xcodegen generate

      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild build \
            -project SiempreCercaMonitor.xcodeproj \
            -scheme SiempreCercaMonitor \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | tail -20

      - name: Archive (when signing is available)
        if: env.HAS_SIGNING == 'true'
        run: |
          cd ios
          xcodebuild archive \
            -project SiempreCercaMonitor.xcodeproj \
            -scheme SiempreCercaMonitor \
            -archivePath build/SiempreCercaMonitor.xcarchive \
            -destination 'generic/platform=iOS'

          xcodebuild -exportArchive \
            -archivePath build/SiempreCercaMonitor.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: siemprecerca-monitor-ios
          path: ios/build/
          retention-days: 90
          if-no-files-found: ignore
